# Profil FTMO -- Challenge 1 étape. Mêmes seuils que le 2-Step (5%/10%),
# seule différence VÉRIFIÉE : le drawdown total est TRAILING (le plancher
# monte avec les nouveaux sommets d'équité) plutôt que statique. Voir
# ftmo_2step.yaml pour les sources et la note sur max_risk_pct
# (recommandation, pas une règle FTMO enforcée).
name: "FTMO — Challenge 1 étape"

per_trade:
  max_risk_pct: 0.01

daily_loss:
  enabled: true
  max_pct: 0.05
  basis: "equity"
  reset_time_local: "00:00"
  reset_timezone: "Europe/Prague"

total_drawdown:
  enabled: true
  max_pct: 0.10
  mode: "trailing"    # seule différence avec le 2-Step -- le plancher suit les nouveaux sommets

# COORDINATION INTER-STYLES (19/09) : voir ftmo_2step.yaml -- même posture
# prudente, hedging FTMO non vérifié avec certitude pour ce type de
# challenge, coordination désactivée par défaut (hedging possible).
conflict_resolution:
  mode: "disabled"

# PLAFOND D'EXPOSITION CUMULÉE : voir ftmo_2step.yaml pour le raisonnement
# (2.28% de pire cas avec max_risk_pct à 1%, plafonné à la moitié de la
# règle daily_loss de 5%). Le drawdown TRAILING de ce profil rend ce
# plafond encore plus utile : chaque perte simultanée y rapproche
# définitivement du plancher, qui ne redescend jamais.
cumulative_exposure:
  enabled: true
  max_pct: 0.025
