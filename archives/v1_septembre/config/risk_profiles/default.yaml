# Profil de risque "défaut" -- reproduit EXACTEMENT le comportement actuel
# du projet (rien ne change tant que live.risk_profile n'est pas réglé sur
# ce nom ou un autre explicitement dans config/autonomous.yaml). Sert aussi
# de modèle pour créer un profil personnalisé.
name: "Défaut (comportement actuel du projet, sans contrainte de prop firm)"

per_trade:
  max_risk_pct: 0.02        # = live.max_risk_pct_per_trade actuel

total_drawdown:
  enabled: true
  max_pct: 0.15              # = live.max_account_drawdown_pct actuel
  mode: "trailing"           # = comportement actuel de account_guard.py (pic d'équité historique)

# DISJONCTEUR DE DRAWDOWN JOURNALIER (19/09, audit institutionnel section 5,
# "Disjoncteur de Drawdown Journalier (Hard Cap)" -- ACTIVÉ ici, alors que ce
# profil "défaut" n'imposait jusqu'ici aucune notion de perte quotidienne) :
# règle ABSOLUE et INDÉPENDANTE du réseau de neurones/LLM (voir
# src/account_guard.py::check, appelée depuis demo_trader.py à CHAQUE cycle,
# avant toute décision) -- si la perte cumulée du jour (équité réelle,
# positions fermées ET flottantes confondues) atteint 3% du capital, tout
# nouvel ordre est bloqué jusqu'au lendemain (reprise AUTOMATIQUE au passage
# de minuit UTC, voir `live.daily_loss_auto_resume` dans autonomous.yaml,
# défaut true -- contrairement au coupe-circuit de drawdown TOTAL ci-dessous,
# qui reste à réinitialisation manuelle explicite). Seuil de 3% choisi comme
# valeur d'exemple directement citée par le cahier des charges institutionnel
# -- volontairement plus strict que `total_drawdown.max_pct` (15%, la limite
# tolérée sur la durée) puisqu'une perte QUOTIDIENNE de cette ampleur est un
# signal d'alerte bien avant d'approcher le pire cas global toléré.
daily_loss:
  enabled: true
  max_pct: 0.03
  basis: "equity"                   # évalué en continu, positions flottantes incluses (pas juste le réalisé)
  reset_time_local: "00:00"
  reset_timezone: "UTC"              # pas de firme externe pour ce profil "défaut" -- UTC simple

# COORDINATION INTER-STYLES (19/09, passé à "temporal_hierarchy" le 17/09
# suivant) : le hedging (positions BUY/SELL simultanées sur XAUUSD par deux
# styles différents) n'est pas interdit universellement -- ce profil
# "défaut" n'a aucune contrainte de prop firm, donc pas d'obligation
# d'éviter le hedging. Activé quand même ICI (par choix, pas par contrainte
# externe) pour observer un comportement de démo plus cohérent : évite les
# allers-retours coûteux en spread observés quand deux styles ouvrent des
# directions opposées à quelques secondes d'intervalle.
# "temporal_hierarchy" (voir TIMEFRAME_HIERARCHY dans demo_trader.py)
# remplace ici l'ancien "priority_by_score" : l'arbitrage se fait sur le
# RANG du timeframe (D1 > H4 > H1 > M30 > M15), jamais sur le score
# walk-forward -- un style de swing (D1) n'est jamais bloqué par un style
# de scalping (M15) juste parce que ce dernier a eu un meilleur score de
# validation récent, ce qui pouvait arriver avec "priority_by_score".
# Désactivable (mode: "disabled") sans que ça change quoi que ce soit
# d'autre.
conflict_resolution:
  mode: "temporal_hierarchy"

# PLAFOND D'EXPOSITION CUMULÉE (19/09) -- ACTIVÉ ici, et ce n'est pas
# optionnel sur ce profil : c'est lui qui active aussi le budget de risque
# DYNAMIQUE (option B, voir demo_trader.py), lequel peut structurellement
# dépasser `per_trade.max_risk_pct`. Cinq styles d'accord sur la même
# direction, ouvrant l'un après l'autre, cumulent 2% + 1% + 0.67% + 0.5% +
# 0.4% = 4.57% de risque simultané (2.28x le 2% nominal par trade), parce
# qu'une position déjà ouverte n'est jamais redimensionnée quand un nouveau
# style la rejoint. Laisser ce plafond désactivé sur LE profil qui active
# l'option B reviendrait à assumer ce 4.57% sans aucune borne.
#
# POURQUOI 4% (et pas 2%, ni 5%) :
#   - 2% (= restaurer l'invariant d'origine à la lettre) neutraliserait le
#     multi-position : le premier style à ouvrir consommerait tout le
#     budget et plus aucun autre ne pourrait jamais s'ouvrir.
#   - 5% ne bloquerait RIEN dans le pire cas mesuré (4.57% < 5%) : un
#     plafond de façade, qui ne rétablit aucun invariant.
#   - 4% mord réellement (il bloque les 4ᵉ et 5ᵉ ouvertures du scénario
#     ci-dessus, cumul réel plafonné à ~3.67%), tout en laissant 3 styles
#     se diversifier, et reste très en dessous du coupe-circuit de compte
#     (total_drawdown 15% ci-dessus).
# À réévaluer avec des trades réels : c'est une valeur d'exploration.
cumulative_exposure:
  enabled: true
  max_pct: 0.04
